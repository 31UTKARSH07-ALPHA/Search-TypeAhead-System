upstream frontend_upstream {
    server frontend:3000;
}

upstream search_service_upstream {
    server search-service:4001;
}

upstream suggestion_service_upstream {
    server suggestion-service:4002;
}

upstream batch_worker_upstream {
    server batch-worker:4003;
}

server {
    listen 80;
    server_name _;

    location = /search/health {
        proxy_pass http://search_service_upstream/health;
    }

    location = /suggest/health {
        proxy_pass http://suggestion_service_upstream/health;
    }

    location = /batch/health {
        proxy_pass http://batch_worker_upstream/health;
    }

    location /suggest {
        add_header X-Typeahead-Upstream suggestion-service always;
        proxy_pass http://suggestion_service_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /cache/debug {
        add_header X-Typeahead-Upstream suggestion-service always;
        proxy_pass http://suggestion_service_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /trending {
        add_header X-Typeahead-Upstream suggestion-service always;
        proxy_pass http://suggestion_service_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /search {
        add_header X-Typeahead-Upstream search-service always;
        proxy_pass http://search_service_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
