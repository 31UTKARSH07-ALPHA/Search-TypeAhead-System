services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_started
      search-service:
        condition: service_healthy
      suggestion-service:
        condition: service_healthy
      batch-worker:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"

  search-service:
    build:
      context: .
      dockerfile: services/search-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "4001"
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: search-events
    ports:
      - "4001:4001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  suggestion-service:
    build:
      context: .
      dockerfile: services/suggestion-service/Dockerfile
    depends_on:
      # index-builder now runs continuously, so it never "completes"; the service's own
      # readiness gate (waitForCurrentIndexVersion) holds traffic until the first index is published.
      index-builder:
        condition: service_started
      redis-cluster-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "4002"
      DATABASE_URL: postgres://typeahead:typeahead@postgres:5432/typeahead
      REDIS_CLUSTER_NODES: redis-node-0:6379,redis-node-1:6379,redis-node-2:6379
      # Covers the first full index build, which now runs while this service waits.
      CACHE_READY_TIMEOUT_MS: "600000"
      CACHE_READY_POLL_MS: "1000"
    ports:
      - "4002:4002"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  index-builder:
    build:
      context: .
      dockerfile: services/suggestion-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://typeahead:typeahead@postgres:5432/typeahead
      REDIS_CLUSTER_NODES: redis-node-0:6379,redis-node-1:6379,redis-node-2:6379
      # Serving index covers the most popular queries; the long tail lives in
      # PostgreSQL. Sized for the ORCAS dataset (~10.4M rows) on a single host.
      # Raise INDEX_SOURCE_ROW_LIMIT for more coverage if Redis has headroom.
      INDEX_SOURCE_ROW_LIMIT: "200000"
      INDEX_MAX_PREFIX_LENGTH: "20"
      # Rebuild every 5 minutes so new searches show up in /suggest.
      INDEX_REBUILD_INTERVAL_SECONDS: "300"
    command: ["npm", "run", "index:build"]
    restart: unless-stopped

  batch-worker:
    build:
      context: .
      dockerfile: services/batch-worker/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4003"
      DATABASE_URL: postgres://typeahead:typeahead@postgres:5432/typeahead
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: search-events
      KAFKA_GROUP_ID: batch-worker
      FLUSH_INTERVAL_MS: "2000"
      FLUSH_MAX_UNIQUE_QUERIES: "100"
    ports:
      - "4003:4003"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 30"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:29092 1 30"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic search-events --partitions 1 --replication-factor 1
    restart: "no"

  redis-node-0:
    image: redis:7.2-alpine
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--protected-mode", "no"]
    volumes:
      - redis-node-0-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-node-1:
    image: redis:7.2-alpine
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--protected-mode", "no"]
    volumes:
      - redis-node-1-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-node-2:
    image: redis:7.2-alpine
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--protected-mode", "no"]
    volumes:
      - redis-node-2-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-node-3:
    image: redis:7.2-alpine
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--protected-mode", "no"]
    volumes:
      - redis-node-3-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-node-4:
    image: redis:7.2-alpine
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--protected-mode", "no"]
    volumes:
      - redis-node-4-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-node-5:
    image: redis:7.2-alpine
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--protected-mode", "no"]
    volumes:
      - redis-node-5-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-cluster-init:
    image: redis:7.2-alpine
    depends_on:
      redis-node-0:
        condition: service_healthy
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
      redis-node-4:
        condition: service_healthy
      redis-node-5:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        if redis-cli -h redis-node-0 -p 6379 cluster info | grep -q "cluster_state:ok"; then
          echo "Redis cluster already healthy"
        else
          redis-cli --cluster create redis-node-0:6379 redis-node-1:6379 redis-node-2:6379 redis-node-3:6379 redis-node-4:6379 redis-node-5:6379 --cluster-replicas 1 --cluster-yes
        fi
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: typeahead
      POSTGRES_USER: typeahead
      POSTGRES_PASSWORD: typeahead
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typeahead -d typeahead"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
  redis-node-0-data:
  redis-node-1-data:
  redis-node-2-data:
  redis-node-3-data:
  redis-node-4-data:
  redis-node-5-data:
